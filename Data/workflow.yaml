stages:
  - name: ingestion
    statuses: [raw, processing, completed]
  - name: review
    statuses: [pending_ai, pending_human, rejected, approved]
  - name: deployment
    statuses: [queued, active]

transitions:
  # Move inside ingestion stage
  - trigger: process_data
    source: ingestion.raw
    dest: ingestion.processing
  - trigger: complete_processing
    source: ingestion.processing
    dest: ingestion.completed
    
  # Transition from Ingestion stage to Review stage
  - trigger: send_to_review
    source: ingestion.completed
    dest: review.pending_ai
    
  # Rule-based progression via AI and Human loops
  - trigger: ai_approve
    source: review.pending_ai
    dest: review.pending_human
  - trigger: human_approve
    source: review.pending_human
    dest: deployment.queued
  - trigger: reject
    source: review.pending_human
    dest: review.rejected
