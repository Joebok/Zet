[GitHub]
Repository = "Joebok/Zet"
TimeoutSeconds = 20.0
UsageReservePercent = 10.0
TrustedUsers = ["Joebok"]

[Runtime]
Role = "local"

[GitHubByPlatform.Windows]
StatePath = "C:/Users/Joe/Projects/Zet_Runtime/state"

[RuntimeByPlatform.Windows]
Root = "C:/Users/Joe/Projects/Zet_Runtime"

[Storage]
Indexes = "Indexes"
QueueState = "AI_Queue"
MigrationState = "LibraryReferenceUpdates"
WorkflowState = "TaskWorkflow"
CompletedRetentionDays = 7
MaintenanceIntervalHours = 24

[StorageByPlatform.Windows]
Root = "E:/Zet/AppData"

[BaseFolders]
BaseLibraryPath = "Zet_Library_v5/"
BaseCharacterPath = "Characters/"
BaseAssetPath = "Assets/"
BasePipelinePath = "Pipelines/"
BaseAIQueuePath = "AI_Queue/"

[BaseFoldersByPlatform.Windows]
BaseLibraryPath = "E:/Zet/Zet_Library_v5/"
BaseAIQueuePath = "E:/Zet/AI_Queue"

[BaseFoldersByPlatform.Darwin]
BaseLibraryPath = "/Users/joe/Projects/Zet_Library-V5/"
BaseAIQueuePath = "/Users/joe/Library/CloudStorage/Dropbox/AI_Queue/"

[PromptCondense]
Enabled = false
PromptFile = "Config/Prompt_Condense_Tasks/Condense_Zet.md"

[AIModels]
AssetWorkflow = "general:latest"
CodexDefault = "gpt-6-luna"
PromptCondense = "image-analysis:latest"
PromptAnalysis = "image-analysis:latest"
ImageDescription = "image-analysis:latest"
SceneBuilder = "general:latest"
NarrativeScene = "general:latest"

LocalBodyReferenceReview = "image-analysis:latest"
[LocalRender]
AutoQueueAfterCondense = false
Backend = "comfyui"

[ComfyUI]
Profile = "comfyui-qwen-image-2-1-scene"
ServerURL = "http://127.0.0.1:8188"
Checkpoint = "qwen_image_2.1_int8_convrot.safetensors"
PositivePromptGlobals = "(masterpiece, best quality, highres), sharp focus"
NegativePromptGlobals = ""
PollSeconds = 1.0
TimeoutSeconds = 300.0

[ComfyUI.QwenImage21]
reference_resize_enabled = true
reference_max_pixels = 1048576
reference_total_max_pixels = 6291456
cache_device = "cpu"
cache_dtype = "int8"

[Zine]
PrintScale = 0.97
PageMargin = 4
Width = 3300

[Turnaround]
Width = 3960

[AIHarvest]
AutoEnabled = true
IntervalSeconds = 60
ArchivePath = "E:/Archived/AI_Queue_Archive"
Debug = false
DebugRetentionDays = 7
DebugMaxBytes = 1073741824

[Render]
Backend = "manual_chatgpt"

[AIPromptAnalysis]
AutoQueueOnRender = false
InstructionsFile = "Config/AI_Prompt_Analysis_Instructions.md"

[[SceneCandidateSources]]
Key = "moonsea"
Label = "Moonsea Adventures"
Path = "C:/Users/Joe/Projects/Adventure Log/Moonsea/characters/Scene_Candidate_Index.md"
DefaultStorySlug = "Phlan-Adventures"
ReadOnly = true
