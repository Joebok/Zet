[BaseFolders]
BaseLibraryPath = "Zet_Library/"
BaseCharacterPath = "Characters/"
BaseAssetPath = "Assets/"
BasePipelinePath = "Pipelines/"
BaseAIQueuePath = "AI_Queue/"

[BaseFoldersByPlatform.Windows]
BaseLibraryPath = "C:/Users/Joe/Projects/Zet_Library/"
BaseAIQueuePath = "C:/Users/Joe/Dropbox/AI_Queue"

[BaseFoldersByPlatform.Darwin]
BaseLibraryPath = "/Users/joe/Projects/Zet_Library/"
BaseAIQueuePath = "/Users/joe/Library/CloudStorage/Dropbox/AI_Queue/"

[PromptCondense]
Enabled = false
Model = "qwen2.5vl:3b"
PromptFile = "Config/Prompt_Condense_Tasks/Condense_Zet.md"

[LocalRender]
AutoQueueAfterCondense = false
Backend = "comfyui"

[StableMatrix]
Profile = "scene-preview-sd15"
PositivePromptGlobals = "(masterpiece, best quality, highres), sharp focus"
NegativePromptGlobals = "EasyNegative"
LayoutBackend = "forge_couple_basic"
StrictPrimarySubjectCount = true
ForgeCoupleDebugBasePass = true
Checkpoint = "sd\\perfectdeliberate_v90.safetensors [aea4ec6c4d]"

[ComfyUI]
Profile = "comfyui-ipadapter-preview"
ServerURL = "http://127.0.0.1:8188"
Checkpoint = "perfectdeliberate_v90.safetensors"
PositivePromptGlobals = "(masterpiece, best quality, highres), sharp focus"
NegativePromptGlobals = ""
PollSeconds = 1.0
TimeoutSeconds = 300.0

[Zine]
PrintScale = 0.97
PageMargin = 4
Width = 3300

[Turnaround]
Width = 3960

[AIHarvest]
AutoEnabled = true
IntervalSeconds = 60

[Render]
Backend = "manual_chatgpt"

[HeadFitment]
RenderMode = "masked_local"
MaskedLocalPreset = "head-fitment-inpaint"
MaskedLocalCheckpoint = "perfectdeliberate_v90.safetensors"
MaskFeatherPixels = 6
MaskGeneration = "comfyui_ensemble"
MaskAutoConfirm = true
MaskAutoConfirmThreshold = 0.90
MaskSAMAttempts = 3
MaskBiRefNetModel = "birefnet.safetensors"
MaskMediaPipeModel = "mediapipe_face_fp32.safetensors"
MaskSAMCheckpoint = "sam3.1_multiplex_fp16.safetensors"

[AIPromptAnalysis]
Model = "zet-image-analyst:latest"
InstructionsFile = "Config/AI_Prompt_Analysis_Instructions.md"
