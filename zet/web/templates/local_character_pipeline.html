<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{LABEL}}</title>
  <style>
    :root{--ink:#202124;--muted:#667085;--line:#d8dee8;--surface:#f5f7fb;--accent:#2457a6}*{box-sizing:border-box}body{background:var(--surface);color:var(--ink);font:15px system-ui,sans-serif;margin:0}header,main{margin:auto;max-width:1500px;padding:1rem 1.5rem}header{align-items:center;display:flex;gap:1rem;justify-content:space-between}.panel,.view{background:#fff;border:1px solid var(--line);border-radius:9px;margin-bottom:1rem;padding:1rem}.controls,.actions,.view-actions{align-items:end;display:flex;flex-wrap:wrap;gap:.7rem}label{display:grid;gap:.25rem}#costume-label[hidden]{display:none}input,select,textarea,button{border:1px solid #b9c2d0;border-radius:5px;font:inherit;padding:.45rem .6rem}button{background:white;cursor:pointer}button:hover:not(:disabled){border-color:var(--accent)}button:disabled{opacity:.55}.primary{background:#2457a6;color:white}#status{min-height:1.4rem;border-left:4px solid var(--accent);padding-left:.6rem}.muted{color:var(--muted)}.views{display:grid;gap:.8rem}.view>h2{font-size:1.1rem}.view-actions{margin:.6rem 0}.cards{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fill,minmax(185px,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:.55rem}.card img{aspect-ratio:2/3;background:var(--surface);object-fit:contain;width:100%}.card p{overflow-wrap:anywhere}.selected{border-color:#247a43}.candidate-image{border:0;display:block;padding:0;width:100%}.batch-builder{border:1px solid var(--line);border-radius:8px;margin-top:1rem;padding:1rem}.batch-builder h2{font-size:1rem;margin:0 0 .35rem}.batch-form{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:.7rem}.batch-form label{min-width:180px}#rename-batch[hidden]{display:none}.sources{display:flex;flex-wrap:wrap;gap:.6rem;margin:.6rem 0}.source{border:1px solid var(--line);border-radius:6px;padding:.35rem}.source img{height:145px;object-fit:contain;display:block}
  </style>
  <style>#candidate-review{border:0;border-radius:10px;height:min(94vh,1000px);max-height:94vh;max-width:96vw;overflow:hidden;padding:0;position:relative;width:min(1500px,96vw)}#candidate-review::backdrop{background:rgb(0 0 0 / 82%)}.review-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(340px,.8fr);height:100%}.review-images{display:grid;gap:.75rem;grid-template-columns:repeat(2,minmax(0,1fr));min-height:0;overflow:hidden;padding:2rem}.review-image{align-items:center;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow:hidden}.review-image h3{font-size:.95rem;margin:.4rem}.review-image img{flex:1;height:0;max-height:100%;max-width:100%;min-height:0;object-fit:contain;width:100%}.review-panel{overflow-y:auto;padding:1.5rem}.review-panel textarea{min-height:90px;width:100%}.review-panel section{border-top:1px solid var(--line);margin-top:1rem;padding-top:1rem}.review-panel p{line-height:1.4}.review-close{position:absolute;right:1rem;top:.75rem;z-index:3}.review-nav{border-radius:999px;font-size:2rem;height:48px;line-height:1;padding:0;position:absolute;top:50%;transform:translateY(-50%);width:48px;z-index:2}.review-prev{left:.75rem}.review-next{right:.75rem}.decision-options{border:0;display:flex;gap:1rem;padding:0}.decision-option{align-items:center;display:flex;gap:.3rem}.pass{color:#217a3c}.fail{color:#b42318}@media(max-width:900px){.review-layout{grid-template-columns:1fr;grid-template-rows:minmax(280px,52%) minmax(0,48%)}.review-images{padding:3rem 1rem 1rem}.review-panel{padding:1rem}}</style>
</head>
<body>
  <header><div><h1>{{LABEL}}</h1><p class="muted">Local candidate workflow, separate from canonical Assets.</p></div><nav><a href="/local-body-reference">Body-Reference</a> · <a href="/local-head-image">Head-Image</a> · <a href="/local-character-assembly">Character-Assembly</a> · <a href="/local-costume-dressing">Costume-Dressing</a> · <a href="/">Dashboard</a></nav></header>
  <main>
    <details class="panel" id="gate-setup"><summary>Gate settings</summary><div id="gate-settings"></div></details>
    <section class="panel">
      <div class="controls">
        <label>Character<select id="character"></select></label>
        <label>Phase<select id="phase"></select></label>
        <label id="costume-label">Costume<select id="costume"></select></label>
        <label style="min-width:340px">Run ID<select id="runs"></select></label>
        <button id="refresh">Refresh runs</button><button id="start" class="primary" disabled>Start / resume work</button>
        <button id="proceed" class="primary" hidden>Generate other views</button><button id="stop">Stop</button>
        <button id="rerun">Rerun batch</button><button id="delete">Delete batch</button>
      </div>
      <form id="rename-batch" class="batch-form" hidden>
        <label>Current batch name<input id="batch-name" type="text" maxlength="120" placeholder="Defaults to Run ID"></label>
        <button class="primary" type="submit">Save batch name</button>
        <span class="muted">Leave blank to use the Run ID.</span>
      </form>
      <p id="summary" class="muted"></p>
      <section class="batch-builder" aria-labelledby="new-batch-heading">
        <h2 id="new-batch-heading">New batch</h2>
        <div class="controls">
          <label>FRONT candidates<input id="front-count" type="number" min="1" value="8"></label>
          <label>Other view candidates<input id="other-count" type="number" min="1" value="4"></label>
          <button id="preview" type="button">Preview</button><button id="create" class="primary" type="button" disabled>Create batch</button><span id="create-reason" class="muted" role="status">Checking required locked inputs…</span>
        </div>
      </section>
      <p id="status" role="status"></p>
    </section>
    <section id="views" class="views"></section>
    <dialog id="candidate-review" aria-label="Candidate review"><button id="review-close" class="review-close" type="button">Close</button><button id="review-prev" class="review-nav review-prev" type="button" aria-label="Previous candidate">‹</button><div class="review-layout"><section class="review-images"><div class="review-image"><div><h3 id="review-compare-title">FRONT comparison</h3><label id="review-reflection-toggle-label" hidden><input id="review-reflection-toggle" type="checkbox"> Compare opposite-side selection</label></div><img id="review-anchor-image" alt=""><p id="review-anchor-message" class="muted"></p></div><div class="review-image"><h3>Image to review</h3><img id="review-image" alt=""></div></section><aside id="review-panel" class="review-panel"></aside></div><button id="review-next" class="review-nav review-next" type="button" aria-label="Next candidate">›</button></dialog>
  </main>
  <script src="/static/local_pipeline_context.js"></script>
  <script>
  (()=>{
    const pipeline="{{PIPELINE}}", costumeMode=pipeline==="costume-dressing", prefix=`/api/local/${pipeline}`;
    const $=id=>document.getElementById(id), costume=()=>costumeMode?`?costume=${encodeURIComponent($("costume").value.trim())}`:"";
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    let context={characters:[],phases_by_character:{}};
    function fillSelect(select,values,placeholder=""){select.replaceChildren();for(const value of values){const option=document.createElement("option");option.value=value;option.textContent=value;select.append(option)}if(!values.length&&placeholder){const option=document.createElement("option");option.value="";option.textContent=placeholder;select.append(option)}}
    $("costume-label").hidden=!costumeMode;if(!costumeMode)$("costume-label").remove();
    let run=null, reviewCandidates=[], reviewIndex=-1, previewRequest=0;
    async function api(path,options={}){const response=await fetch(prefix+path,{headers:{"Content-Type":"application/json"},...options});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||response.statusText);return data;}
    function say(text){$("status").textContent=text;}
    function base(){return {character:$("character").value.trim(),phase:$("phase").value.trim(),costume:costumeMode?$("costume").value.trim():"",front_count:Number($("front-count").value),other_count:Number($("other-count").value)}}
    async function refreshCostumes(){if(!costumeMode)return;const p=base();if(!p.character||!p.phase){fillSelect($("costume"),[],"Select a character and phase");return}const response=await fetch("/api/costumes?character="+encodeURIComponent(p.character)+"&phase="+encodeURIComponent(p.phase));const data=await response.json();if(!response.ok)throw new Error(data.detail||response.statusText);fillSelect($("costume"),(data.costumes||[]).map(item=>item.name),"No costumes available");}
    async function refreshRuns(){const p=base();const q=new URLSearchParams({character:p.character,phase:p.phase,costume:p.costume});const data=await api(`/runs?${q}`);$("runs").replaceChildren(...data.runs.map(item=>{const option=document.createElement("option");option.value=item.run_id;option.textContent=(item.batch_name||item.run_id)+" · "+item.status+" · "+item.run_id;return option}));if(run&&data.runs.some(item=>item.run_id===run.run_id))$("runs").value=run.run_id;else if(!data.runs.length){run=null;$("views").replaceChildren();$("summary").textContent="";$("rename-batch").hidden=true;}}
    async function loadRun(){const id=$("runs").value;if(!id)return;run=await api(`/runs/${id}${costume()}`);render();}
    function render(){
      if(!run)return;
      const busy=['RUNNING','STOPPING'].includes(run.status);
      $('start').disabled=busy||!['QUEUED','INTERRUPTED'].includes(run.status);$('stop').disabled=!busy;$('rerun').disabled=busy;$('delete').disabled=busy;$('rename-batch').hidden=false;
      if(document.activeElement!==$('batch-name'))$('batch-name').value=run.batch_name||'';
      $('summary').textContent=`${run.character} · ${run.phase}${run.costume?` · ${run.costume}`:''} · ${run.candidate_count} candidates · ${run.status} · FRONT anchor: ${run.front_anchor||'not selected'}`;
      $('proceed').hidden=!(run.front_anchor&&!run.views_started);
      const blocks=[];
      for(const view of run.views){
        const candidates=run.candidates.filter(item=>item.view===view),section=document.createElement('section');section.className='view';section.dataset.view=view;
        const ranking=(run.rankings||{})[view]||{},ordered=ranking.ordered_candidate_ids||[],positions=new Map(ordered.map((id,index)=>[id,index]));
        candidates.sort((a,b)=>(positions.get(a.candidate_id)??Infinity)-(positions.get(b.candidate_id)??Infinity));
        const rankingLabel=ranking.status==='FAILED'?`Luna ranking failed: ${ranking.error||'Unknown error'}`:['QUEUED','RUNNING'].includes(ranking.status)?'Luna ranking in progress':ranking.status==='COMPLETE'?'Luna ranked':'';
        const title=document.createElement('h2');title.textContent=`${view} · ${(run.selected_views||{})[view]||'not selected'}${rankingLabel?` · ${rankingLabel}`:''}`;section.append(title);
        const actions=document.createElement('div');actions.className='view-actions';
        const hasImages=candidates.some(item=>item.image_path),hasFailed=candidates.some(item=>['FAILED','GATE_REJECTED'].includes(item.status)||item.human_review?.decision==='reject'),viewReady=view==='FRONT'||Boolean(run.front_anchor);
        for(const [label,action,disabled] of [['Re-run','rerun-view',busy||!viewReady||!candidates.length],['Re-Run Failed','rerun-failed',busy||!viewReady||!hasFailed],['Re-evaluate','reevaluate',busy||!viewReady||!hasImages],['Rank survivors','rank-view',busy||!viewReady||!hasImages],...(view==='FRONT'?[['Generate other views','proceed',busy||!run.front_anchor]]:[])]){const button=document.createElement('button');button.type='button';button.dataset.action=action;button.textContent=label;button.disabled=disabled;actions.append(button)}section.append(actions);
        const roles=costumeMode?(view==='FRONT'?['character_assembly']:['character_assembly',...(run.front_anchor?['front_costume']:[])]):(view==='FRONT'?['body_reference','head_image']:['body_reference','head_image',...(run.front_anchor?['front_assembly']:[])]);const sources=document.createElement('div');sources.className='sources';
        for(const role of roles){const figure=document.createElement('figure');figure.className='source';const caption=document.createElement('figcaption');caption.textContent=role.replaceAll('_',' ');const image=document.createElement('img');image.loading='lazy';image.alt=caption.textContent;image.src=`${prefix}/runs/${run.run_id}/sources/${view}/${role}${costume()}`;figure.append(caption,image);sources.append(figure)}section.append(sources);
        const prompts=document.createElement('p');prompts.className='muted';for(const [label,path] of [['View review specification',`review-spec/${view}`],['View image prompt',`image-prompt/${view}`]]){if(prompts.childNodes.length)prompts.append(' · ');const link=document.createElement('a');link.href=`${prefix}/runs/${encodeURIComponent(run.run_id)}/${path}${costume()}`;link.target='_blank';link.rel='noopener';link.textContent=label;prompts.append(link)}section.append(prompts);
        const row=document.createElement('div');row.className='cards';
        for(const item of candidates){const selected=(run.selected_views||{})[view]===item.candidate_id,rankPosition=positions.has(item.candidate_id)?positions.get(item.candidate_id)+1:null,card=document.createElement('article');card.className='card'+(selected?' selected':'');card.dataset.candidate=item.candidate_id;
          if(item.image_path){const image=document.createElement('img');image.loading='lazy';image.src=`${prefix}/runs/${encodeURIComponent(run.run_id)}/images/${encodeURIComponent(item.candidate_id)}${costume()}${costumeMode?'&':'?'}v=${encodeURIComponent(item.status+'-'+(item.retry_count||0))}`;image.alt=`${view} candidate ${item.candidate_id}`;const imageButton=document.createElement('button');imageButton.type='button';imageButton.className='candidate-image';imageButton.dataset.action='review';imageButton.append(image);card.append(imageButton)}else{const placeholder=document.createElement('p');placeholder.textContent=item.status;card.append(placeholder)}
          const text=document.createElement('p');text.innerHTML=`<strong>${esc(item.candidate_id)}</strong>${rankPosition?` · Rank #${rankPosition}`:''}`;card.append(text);const status=document.createElement('p');status.className='muted';status.textContent=selected?'Selected':item.status;card.append(status);const summary=document.createElement('div');summary.innerHTML=gateSummary(item);card.append(summary);const controls=document.createElement('div');controls.className='actions';
          const canSelect=!busy&&ranking.status==='COMPLETE'&&rankPosition&&(!item.rejection_gate||item.human_review?.decision==='keep')&&item.human_review?.decision!=='reject';if(canSelect&&!selected){const selectButton=document.createElement('button');selectButton.type='button';selectButton.className='primary';selectButton.textContent='Select';selectButton.dataset.action='select';controls.append(selectButton)}
          if(item.image_path){const reviewButton=document.createElement('button');reviewButton.type='button';reviewButton.textContent='Review';reviewButton.dataset.action='review';reviewButton.dataset.candidate=item.candidate_id;reviewButton.disabled=busy;controls.append(reviewButton)}
          if(['FAILED','GATE_REJECTED'].includes(item.status)){const retryButton=document.createElement('button');retryButton.type='button';retryButton.textContent='Retry';retryButton.dataset.action='retry';retryButton.disabled=busy;controls.append(retryButton)}
          if(selected){const lockButton=document.createElement('button');lockButton.type='button';lockButton.textContent='Lock';lockButton.dataset.action='lock';lockButton.disabled=busy;controls.append(lockButton)}card.append(controls);row.append(card)
        }section.append(row);blocks.push(section)
      }
      $('views').replaceChildren(...blocks);if($('candidate-review').open)renderReview();
    }
    async function act(path,payload){try{run=await api(path+costume(),{method:"POST",body:JSON.stringify(payload)});render();say("Updated.");}catch(error){say(error.message)}}
    const oppositeViews={LEFT_PROFILE:'RIGHT_PROFILE',RIGHT_PROFILE:'LEFT_PROFILE',FRONT_LEFT_3_4:'FRONT_RIGHT_3_4',FRONT_RIGHT_3_4:'FRONT_LEFT_3_4',BACK_LEFT_3_4:'BACK_RIGHT_3_4',BACK_RIGHT_3_4:'BACK_LEFT_3_4'};
    function gateSummary(item){const results=Object.entries(item.gates||{}).map(([key,value])=>{const failed=value.status==='FAILED'||value.verdict==='TRUE',passed=value.verdict==='FALSE',label=value.status==='DISABLED'?'Disabled':value.status==='STALE'?'Stale':passed?'Passed':failed?(value.policy_status==='Warning'?'Warning':'Rejected'):(value.status||'Pending');return `<p class="${failed?'fail':passed?'pass':'muted'}"><strong>${esc(key.replaceAll('_',' '))} gate:</strong> ${esc(label)}${value.reason?` — ${esc(value.reason)}`:''}</p>`}).join('');const human=item.human_review||{},decision=human.decision==='keep'?'Pass':human.decision==='reject'?'Fail':'Undecided';return results+`<p class="${human.decision==='keep'?'pass':human.decision==='reject'?'fail':'muted'}"><strong>Human:</strong> ${decision}</p>`}
    function orderedReviewCandidates(){const candidates=(run?.candidates||[]).filter(item=>item.image_path),views=run?.views||[];return candidates.sort((a,b)=>{const viewOrder=views.indexOf(a.view)-views.indexOf(b.view);if(viewOrder)return viewOrder;const order=run?.rankings?.[a.view]?.ordered_candidate_ids||[],position=item=>{const index=order.indexOf(item.candidate_id);return index<0?Infinity:index};return position(a)-position(b)})}
    function imageUrl(item){return `${prefix}/runs/${encodeURIComponent(run.run_id)}/images/${encodeURIComponent(item.candidate_id)}${costume()}`}
    function renderReview(){
      const item=reviewCandidates[reviewIndex];if(!item)return;$('review-image').src=imageUrl(item);$('review-image').alt=`${item.view} candidate ${item.candidate_id}`;
      const opposite=oppositeViews[item.view],oppositeId=run.selected_views?.[opposite],oppositeItem=(run.candidates||[]).find(candidate=>candidate.candidate_id===oppositeId&&candidate.image_path);
      const frontView=costumeMode?'FRONT':item.view==='FRONT'?null:'FRONT',frontId=run.front_anchor||run.selected_views?.FRONT,frontItem=frontView&&(run.candidates||[]).find(candidate=>candidate.candidate_id===frontId&&candidate.view==='FRONT'&&candidate.image_path);
      const toggle=$('review-reflection-toggle');$('review-reflection-toggle-label').hidden=!opposite;toggle.disabled=!oppositeItem;if(!oppositeItem)toggle.checked=false;
      const comparison=toggle.checked?oppositeItem:frontItem;$('review-compare-title').textContent=toggle.checked?`Selected ${opposite}`:'FRONT comparison';$('review-anchor-image').hidden=!comparison;$('review-anchor-message').hidden=Boolean(comparison);
      if(comparison){$('review-anchor-image').src=imageUrl(comparison);$('review-anchor-image').alt=`Comparison ${comparison.candidate_id}`}else{$('review-anchor-image').removeAttribute('src');$('review-anchor-message').textContent='No selected FRONT image is available for comparison.'}
      const ranking=run.rankings?.[item.view]||{},ordered=ranking.ordered_candidate_ids||[],position=ordered.indexOf(item.candidate_id),entry=(ranking.entries||[]).find(value=>value.candidate_id===item.candidate_id),human=item.human_review||{};
      const gates=Object.entries(item.gates||{}).map(([key,value])=>`<p><strong>${esc(key.replaceAll('_',' '))}:</strong> ${esc(value.status||'Pending')}${value.verdict?` · ${esc(value.verdict)}`:''}${value.reason?` · ${esc(value.reason)}`:''}</p>`).join('')||'<p class="muted">No gate results yet.</p>';
      const panel=$('review-panel'),selectLabel=item.view==='FRONT'?'Select as FRONT anchor':`Select for ${item.view}`;panel.innerHTML=`<p class="muted">Candidate ${reviewIndex+1} of ${reviewCandidates.length}</p><h2>${esc(item.view)} · ${esc(item.candidate_id)}</h2><p><strong>Status:</strong> ${esc(item.status)}${item.rejection_gate?`<br><strong>Rejected by:</strong> ${esc(item.rejection_gate)}`:''}</p><section><h3>Gates</h3>${gates}</section><section><h3>Luna ranking</h3><p>${entry?`Ranked #${position+1}: ${esc(entry.reason)}`:ranking.status==='FAILED'?`Ranking failed: ${esc(ranking.error||'unknown error')}`:'Not ranked'}</p><button data-rank="up" ${position<=0?'disabled':''}>Rank up</button> <button data-rank="down" ${position<0||position>=ordered.length-1?'disabled':''}>Rank down</button></section><section><h3>Human review</h3><fieldset class="decision-options"><legend>Decision</legend>${[['undecided','Undecided'],['keep','Pass'],['reject','Fail']].map(([value,label])=>`<label class="decision-option"><input type="radio" name="human-decision" value="${value}" ${human.decision===value?'checked':''}> ${label}</label>`).join('')}</fieldset><label>Notes<textarea id="review-notes">${String(human.notes||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}</textarea></label><button id="review-save" class="primary">Save human review</button><button id="review-select" ${!entry||ranking.status!=='COMPLETE'?'disabled':''}>${selectLabel}</button><button id="review-gate-data">Add to Gate Test Data</button></section>`;
      panel.querySelector('#review-save').onclick=()=>saveReview();panel.querySelector('#review-select').onclick=()=>act(`/runs/${run.run_id}/views/${item.view}/select`,{candidate_id:item.candidate_id});panel.querySelectorAll('[data-rank]').forEach(button=>button.onclick=()=>moveRank(item,button.dataset.rank));panel.querySelector('#review-gate-data').onclick=()=>addGateDataCase(item).catch(error=>say(error.message));$('review-prev').disabled=reviewIndex<=0;$('review-next').disabled=reviewIndex>=reviewCandidates.length-1;
    }
    function openReview(candidateId){reviewCandidates=orderedReviewCandidates();reviewIndex=reviewCandidates.findIndex(item=>item.candidate_id===candidateId);if(reviewIndex<0)return;renderReview();$('candidate-review').showModal()}
    async function moveReview(offset){const next=reviewIndex+offset;if(next<0||next>=reviewCandidates.length)return;await saveReview(true);reviewIndex=next;renderReview()}
    async function saveReview(silent=false){const item=reviewCandidates[reviewIndex];if(!item)return;const decision=$('review-panel').querySelector('[name="human-decision"]:checked')?.value||'undecided';try{run=await api(`/runs/${run.run_id}/candidates/${item.candidate_id}/review${costume()}`,{method:'POST',body:JSON.stringify({decision,notes:$('review-notes').value})});reviewCandidates=(run.candidates||[]).filter(candidate=>candidate.image_path);reviewIndex=reviewCandidates.findIndex(candidate=>candidate.candidate_id===item.candidate_id);render();if(!silent)say('Human review saved.')}catch(error){say(error.message)}}
    async function imageDataUrl(url){const response=await fetch(url);if(!response.ok)throw new Error('Could not load a gate reference image.');const blob=await response.blob();return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)})}
    async function addGateDataCase(item){const registry=pipeline==='character-assembly'?'local-character-assembly':'local-costume-dressing';const catalogResponse=await fetch(`/api/local-gates/${registry}`);const catalog=await catalogResponse.json();if(!catalogResponse.ok)throw new Error(catalog.detail||'Could not load gate catalog.');const gates=catalog.gates_by_view?.[item.view]||[];if(!gates.length)throw new Error('No gates apply to this view.');const gateName=window.prompt(`Gate key (${gates.map(g=>g.key).join(', ')})`,gates[0].key);if(!gateName)return;const gate=gates.find(value=>value.key===gateName.trim());if(!gate)throw new Error('Choose one of the listed gates.');const expected=String(window.prompt('Correct answer: PASS or FAIL','PASS')||'').toUpperCase();if(!['PASS','FAIL'].includes(expected))throw new Error('Expected answer must be PASS or FAIL.');const payload={pipeline:registry,gate:gate.key,view:item.view,expected,image_data:await imageDataUrl(imageUrl(item)),reference_data:{}};for(const role of gate.image_roles||[]){if(['candidate','candidate_head'].includes(role))continue;let source;if(role==='front_anchor'){const id=run.front_anchor||run.selected_views?.FRONT;source=(run.candidates||[]).find(candidate=>candidate.candidate_id===id&&candidate.image_path);if(!source)throw new Error('This gate requires a selected FRONT image.');payload.reference_data[role]=await imageDataUrl(imageUrl(source))}else{payload.reference_data[role]=await imageDataUrl(`${prefix}/runs/${encodeURIComponent(run.run_id)}/sources/${encodeURIComponent(item.view)}/${encodeURIComponent(role)}${costume()}`)}}const response=await fetch('/api/gate-test-data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.detail||response.statusText);say('Added image to Gate Test Data.')}
    async function moveRank(item,direction){try{run=await api(`/runs/${run.run_id}/views/${item.view}/ranking/move${costume()}`,{method:'POST',body:JSON.stringify({candidate_id:item.candidate_id,direction})});render();say('Luna ranking updated.')}catch(error){say(error.message)}}
    $('review-close').onclick=()=>{$('candidate-review').close()};$('review-prev').onclick=()=>moveReview(-1);$('review-next').onclick=()=>moveReview(1);$('review-reflection-toggle').onchange=renderReview;$('candidate-review').onkeydown=event=>{if(event.target.matches('textarea,input'))return;if(event.key==='ArrowLeft')moveReview(-1);if(event.key==='ArrowRight')moveReview(1)};
    async function checkBatchAvailability(){const request=++previewRequest;$("create").disabled=true;$("create-reason").textContent="Checking required locked inputs…";try{const result=await api("/preview",{method:"POST",body:JSON.stringify(base())});if(request!==previewRequest)return;$("summary").textContent=`${result.candidate_count} candidates · ${result.views.length} views`;$("create").disabled=false;$("create-reason").textContent="";}catch(error){if(request!==previewRequest)return;$("create").disabled=true;$("create-reason").textContent=error.message;}}
    $("character").onchange=async()=>{ZetLocalPipelineContext.fillPhases($("phase"),context,$("character").value);await refreshCostumes();run=null;await refreshRuns().catch(error=>say(error.message));await checkBatchAvailability();};
    $("phase").onchange=async()=>{await refreshCostumes();run=null;await refreshRuns().catch(error=>say(error.message));await checkBatchAvailability();};
    if(costumeMode)$("costume").onchange=()=>{run=null;refreshRuns().catch(error=>say(error.message));checkBatchAvailability();};
    $("front-count").onchange=$("other-count").onchange=()=>checkBatchAvailability();
    $("preview").onclick=checkBatchAvailability;
    $("create").onclick=async()=>{try{run=await api("/runs",{method:"POST",body:JSON.stringify(base())});await refreshRuns();$("runs").value=run.run_id;render();say("Batch created.")}catch(error){say(error.message);await checkBatchAvailability()}};
    $("rename-batch").addEventListener("submit",async event=>{event.preventDefault();if(!run)return;try{run=await api("/runs/"+encodeURIComponent(run.run_id)+"/name"+costume(),{method:"PUT",body:JSON.stringify({batch_name:$("batch-name").value})});await refreshRuns();$("runs").value=run.run_id;render();say("Saved batch name for Run ID "+run.run_id+".")}catch(error){say(error.message)}});
    $("refresh").onclick=()=>Promise.all([refreshRuns().then(loadRun),checkBatchAvailability()]).catch(error=>say(error.message));$("runs").onchange=()=>loadRun().catch(error=>say(error.message));
    $("start").onclick=async()=>{try{const action=run?.status==="INTERRUPTED"?"resume":"start";await api(`/runs/${$("runs").value}/${action}${costume()}`,{method:"POST"});say("Work started in the background.");setTimeout(()=>loadRun().catch(()=>{}),1500)}catch(error){say(error.message)}};
    $("rerun").onclick=async()=>{if(!run)return;try{run=await api(`/runs/${run.run_id}/rerun${costume()}`,{method:"POST"});render();say("Batch rerun queued.")}catch(error){say(error.message)}};
    $("delete").onclick=async()=>{if(!run||!window.confirm("Delete this local batch and its run-owned artifacts?"))return;try{await api(`/runs/${run.run_id}${costume()}`,{method:"DELETE"});run=null;await refreshRuns();$("views").replaceChildren();$("summary").textContent="";say("Batch deleted.")}catch(error){say(error.message)}};
    $("proceed").onclick=async()=>{try{run=await api(`/runs/${run.run_id}/views/FRONT/proceed${costume()}`,{method:"POST"});render();say("Remaining views queued.")}catch(error){say(error.message)}};
    $("stop").onclick=async()=>{if(!run)return;try{run=await api(`/runs/${run.run_id}/stop${costume()}`,{method:"POST"});render();say("Stop requested.")}catch(error){say(error.message)}};
    $('views').addEventListener('click',async event=>{
      const button=event.target.closest('button[data-action]');if(!button||!run)return;const action=button.dataset.action,section=button.closest('.view'),view=section?.dataset.view,card=button.closest('.card'),candidate=card?.dataset.candidate;
      try{
        if(action==='rank-view'){await api(`/runs/${run.run_id}/views/${view}/rank${costume()}`,{method:'POST'});say(`${view} ranking queued.`);return}
        if(action==='rerun-view'){if(!window.confirm(`Re-run all ${view} candidates? Their current images and reviews will be replaced.`))return;run=await api(`/runs/${run.run_id}/views/${view}/rerun${costume()}`,{method:'POST'});render();return}
        if(action==='rerun-failed'){if(!window.confirm(`Re-run failed ${view} candidates?`))return;run=await api(`/runs/${run.run_id}/rerun-failed?view=${encodeURIComponent(view)}${costume().replace('?','&')}`,{method:'POST'});render();return}
        if(action==='reevaluate'){run=await api(`/runs/${run.run_id}/reevaluate?view=${encodeURIComponent(view)}${costume().replace('?','&')}`,{method:'POST'});render();say(`${view} re-evaluation queued.`);return}
        if(action==='proceed'){run=await api(`/runs/${run.run_id}/views/FRONT/proceed${costume()}`,{method:'POST'});render();return}
        if(action==='review'){openReview(candidate);return}
        if(!candidate)return;
        if(action==='select'){run=await api(`/runs/${run.run_id}/views/${view}/select${costume()}`,{method:'POST',body:JSON.stringify({candidate_id:candidate})});render();return}
        if(action==='pass'||action==='fail'){run=await api(`/runs/${run.run_id}/candidates/${candidate}/review${costume()}`,{method:'POST',body:JSON.stringify({decision:action==='pass'?'keep':'reject'})});render();return}
        if(action==='retry'){run=await api(`/runs/${run.run_id}/candidates/${candidate}/retry${costume()}`,{method:'POST'});render();return}
        if(action==='lock'){await api(`/runs/${run.run_id}/views/${view}/lock${costume()}`,{method:'POST'});await loadRun();say(`${view} locked.`)}
      }catch(error){say(error.message)}
    });
    async function loadGates(){try{const registry=pipeline==="character-assembly"?"local-character-assembly":"local-costume-dressing";const data=await fetch(`/api/local-gates/${registry}`).then(response=>response.json());const host=$("gate-settings");host.replaceChildren();for(const [key,gate] of Object.entries(data.gates||{})){const row=document.createElement("label");row.style.cssText="display:flex;align-items:center;gap:.6rem;margin:.45rem 0";const text=document.createElement("span");text.textContent=key;const select=document.createElement("select");select.style.width="115px";for(const status of ["Disabled","Warning","Active"]){const option=document.createElement("option");option.value=status;option.textContent=status;select.append(option)}select.value=data.statuses[key]||"Disabled";select.onchange=async()=>{try{const response=await fetch(`/api/local-gates/${registry}/${key}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:select.value})});if(!response.ok)throw new Error("Could not save gate setting")}catch(error){say(error.message)}};row.append(text,select);host.append(row)}}catch(error){say(error.message)}}
    async function init(){try{context=await ZetLocalPipelineContext.initialize($("character"),$("phase"));await refreshCostumes();await refreshRuns();await loadRun();await loadGates();await checkBatchAvailability()}catch(error){say(error.message);$("create").disabled=true;$("create-reason").textContent=error.message}}
    init();
    setInterval(()=>{if(run?.run_id&&!$('candidate-review').open)loadRun().catch(()=>{});},5000);
  })();
  </script>
</body>
</html>
