<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Review Gate Test Data</title>
<style>body{margin:0;background:#f5f7fb;color:#202124;font:15px system-ui,sans-serif}header,main{max-width:1300px;margin:auto;padding:1rem 1.5rem}.panel,.case{background:#fff;border:1px solid #d8dee8;border-radius:9px;padding:1rem;margin-bottom:1rem}.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:end}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.8rem}label{display:grid;gap:.3rem}button,select{font:inherit;padding:.5rem;border:1px solid #b9c2d0;border-radius:5px;background:#fff}img{width:100%;height:220px;object-fit:contain;background:#111}.muted{color:#667085}.danger{color:#b42318}</style></head>
<body><header><h1>Review Gate Test Data</h1><nav><a href="/gate-test-rig">Gate Test Rig</a> · <a href="/">Dashboard</a></nav></header><main>
<section class="panel"><div class="row"><label>Pipeline<select id="pipeline"></select></label><label>Gate<select id="gate"></select></label><button id="refresh">Refresh</button><a href="/gate-test-rig">Add test data</a></div><p id="status" class="muted"></p></section><section id="cases" class="grid"></section>
<script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let catalog=null;
async function request(url,options={}){const r=await fetch(url,options);let v={};try{v=await r.json()}catch(_){}if(!r.ok)throw new Error(v.detail||'Request failed');return v}
async function init(){const v=await request('/api/gate-test-rig/catalog');$('#pipeline').innerHTML=(v.pipelines||[]).map(p=>`<option value="${esc(p.key)}">${esc(p.label)}</option>`).join('');await pipelineChanged()}
async function pipelineChanged(){catalog=await request(`/api/gate-test-rig/catalog?pipeline=${encodeURIComponent($('#pipeline').value)}`);$('#gate').innerHTML=Object.keys(catalog.gates||{}).map(g=>`<option>${esc(g)}</option>`).join('');await loadCases()}
async function loadCases(){const pipeline=$('#pipeline').value,gate=$('#gate').value;if(!gate)return;const data=(await request(`/api/gate-test-data?pipeline=${encodeURIComponent(pipeline)}&gate=${encodeURIComponent(gate)}`)).cases||[];$('#status').textContent=`${data.length} cases · edits update expected answer and view.`;$('#cases').innerHTML=data.map(c=>`<article class="case"><img src="/api/gate-test-data/${encodeURIComponent(pipeline)}/${encodeURIComponent(gate)}/${encodeURIComponent(c.case_id)}/image/candidate"><p><strong>${esc(c.case_id)}</strong></p><label>View<select data-view="${esc(c.case_id)}">${catalog.views.map(v=>`<option ${v===c.view?'selected':''}>${esc(v)}</option>`).join('')}</select></label><label>Expected answer<select data-expected="${esc(c.case_id)}"><option ${c.expected==='PASS'?'selected':''}>PASS</option><option ${c.expected==='FAIL'?'selected':''}>FAIL</option></select></label><p class="muted">References: ${esc(Object.keys(c.references||{}).join(', ')||'none')}</p><button data-save="${esc(c.case_id)}">Save changes</button> <button class="danger" data-delete="${esc(c.case_id)}">Delete</button></article>`).join('');document.querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click',async()=>{try{const id=b.dataset.save;await request(`/api/gate-test-data/${encodeURIComponent(pipeline)}/${encodeURIComponent(gate)}/${encodeURIComponent(id)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({view:$(`[data-view="${id}"]`).value,expected:$(`[data-expected="${id}"]`).value})});$('#status').textContent='Case updated.';await loadCases()}catch(e){$('#status').textContent=e.message}}));document.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',async()=>{try{await request(`/api/gate-test-data/${encodeURIComponent(pipeline)}/${encodeURIComponent(gate)}/${encodeURIComponent(b.dataset.delete)}`,{method:'DELETE'});await loadCases()}catch(e){$('#status').textContent=e.message}}))}
$('#pipeline').addEventListener('change',()=>void pipelineChanged().catch(e=>$('#status').textContent=e.message));$('#gate').addEventListener('change',()=>void loadCases().catch(e=>$('#status').textContent=e.message));$('#refresh').addEventListener('click',()=>void loadCases().catch(e=>$('#status').textContent=e.message));void init().catch(e=>$('#status').textContent=e.message);
</script></main></body></html>
