<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Character Overview · Zet</title>
  <style>
    :root{font:16px/1.45 system-ui,sans-serif;color:#e8edf3;background:#111820}body{margin:0;padding:1.25rem 2rem}header{display:flex;justify-content:space-between;align-items:start;gap:1rem;border-bottom:1px solid #344250;padding-bottom:1rem}h1,h2,h3,p{margin:.25rem 0 .65rem}a{color:#91c9ff}.muted{color:#a8b5c2}.row{margin:1.25rem 0;padding:1rem;border:1px solid #344250;border-radius:.6rem}.row h2{font-size:1.2rem}.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1rem;margin-top:.8rem}.slot{background:#1a2530;border:1px solid #344250;border-radius:.5rem;padding:.7rem;min-width:0}.slot img,.placeholder{display:block;width:100%;aspect-ratio:3/4;object-fit:contain;background:#0d1319;border-radius:.3rem}.placeholder{display:grid;place-items:center;color:#91a0ad;text-align:center}.state{min-height:2.8em;color:#c3d0dd;font-size:.92rem}button{border:1px solid #6d8294;border-radius:.35rem;background:#273747;color:#fff;padding:.45rem .75rem;cursor:pointer}button.primary{background:#1768a5;border-color:#4598d4}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:.5rem;align-items:center}.error{color:#ffaaa2}.empty{padding:1.2rem;color:#a8b5c2}@media(max-width:650px){body{padding:1rem}header{display:block}}
  </style>
</head>
<body>
  <header><div><h1>Local Character Overview</h1><p class="muted">Locked local Costume-Dressing FRONT images by character, phase, and costume.</p></div><nav><a href="/local-body-reference">Body-Reference</a> · <a href="/local-head-image">Head-Image</a> · <a href="/local-character-assembly">Character-Assembly</a> · <a href="/local-costume-dressing">Costume-Dressing</a> · <a href="/">Dashboard</a></nav></header>
  <p id="page-status" class="muted" aria-live="polite">Loading…</p>
  <main id="overview"></main>
  <script>
  (()=>{
    const host=document.querySelector('#overview'),pageStatus=document.querySelector('#page-status');
    const escPath=value=>encodeURIComponent(value);
    const slotPath=(slot,action='autogenerate')=>`/api/local/character-overview/${escPath(slot.character)}/${escPath(slot.phase)}/${escPath(slot.name)}/${action}`;
    let loading=false;
    function make(tag,cls,text){const item=document.createElement(tag);if(cls)item.className=cls;if(text!==undefined)item.textContent=text;return item}
    function render(data){
      const rows=[];
      for(const row of data.rows||[]){
        const section=make('section','row'),title=make('h2','',`${row.character} · ${row.phase}`),slots=make('div','slots');section.append(title,slots);
        for(const slot of row.costumes||[]){slot.character=row.character;slot.phase=row.phase;const card=make('article','slot'),name=make('h3','',slot.name);card.append(name);
          if(slot.image_url){const image=make('img');image.src=slot.image_url;image.alt=`Locked front view · ${row.character} · ${row.phase} · ${slot.name}`;image.loading='lazy';card.append(image)}
          else card.append(make('div','placeholder','No locked FRONT image'));
          const status=make('p','state'+(slot.state==='ERROR'?' error':''),slot.message||({IDLE:'Ready to generate.',QUEUED:'Queued.',RUNNING:`Working on ${slot.pipeline||'local pipeline'}…`,CANCELLED:'Stopped. Start again to retry.'}[slot.state]||slot.state));card.append(status);
          const actions=make('div','actions');if(slot.state==='RUNNING'||slot.state==='QUEUED'){const stop=make('button','', 'Stop');stop.dataset.action='stop';stop.dataset.path=slotPath(slot,'stop');actions.append(stop)}
          else if(!slot.image_url){const start=make('button','primary',slot.state==='ERROR'||slot.state==='CANCELLED'?'Try again':'Autogenerate');start.dataset.action='start';start.dataset.path=slotPath(slot);actions.append(start)}
          card.append(actions);slots.append(card)
        }
        if(!(row.costumes||[]).length)section.append(make('p','empty','No costumes for this phase.'));
        rows.push(section)
      }
      if(!rows.length)host.replaceChildren(make('p','empty','No characters or phases were found.'));else host.replaceChildren(...rows)
    }
    async function refresh(){if(loading)return;loading=true;try{const response=await fetch('/api/local/character-overview');const data=await response.json();if(!response.ok)throw new Error(data.detail||response.statusText);render(data);pageStatus.textContent='Overview refreshes automatically while this page is open.'}catch(error){pageStatus.textContent=error.message;pageStatus.className='error'}finally{loading=false}}
    host.addEventListener('click',async event=>{const button=event.target.closest('button[data-action]');if(!button)return;button.disabled=true;try{const response=await fetch(button.dataset.path,{method:'POST'});const data=await response.json();if(!response.ok)throw new Error(data.detail||response.statusText);await refresh()}catch(error){pageStatus.textContent=error.message;pageStatus.className='error';button.disabled=false}});
    refresh();setInterval(refresh,2500);
  })();
  </script>
</body>
</html>
