<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Character Overview · Zet</title>
  <style>
    :root{font:16px/1.45 system-ui,sans-serif;color:#e8edf3;background:#111820}body{margin:0;padding:1.25rem 2rem}header{display:flex;justify-content:space-between;align-items:start;gap:1rem;border-bottom:1px solid #344250;padding-bottom:1rem}h1,h2,h3,p{margin:.25rem 0 .65rem}a{color:#91c9ff}.muted{color:#a8b5c2}.row{margin:1.25rem 0;padding:1rem;border:1px solid #344250;border-radius:.6rem}.row h2{font-size:1.2rem}.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1rem;margin-top:.8rem}.slot{background:#1a2530;border:1px solid #344250;border-radius:.5rem;padding:.7rem;min-width:0}.slot img,.placeholder{display:block;width:100%;aspect-ratio:3/4;object-fit:contain;background:#0d1319;border-radius:.3rem}.placeholder{display:grid;place-items:center;color:#91a0ad;text-align:center}.state{min-height:2.8em;color:#c3d0dd;font-size:.92rem}button{border:1px solid #6d8294;border-radius:.35rem;background:#273747;color:#fff;padding:.45rem .75rem;cursor:pointer}button.primary{background:#1768a5;border-color:#4598d4}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:.5rem;align-items:center}.error{color:#ffaaa2}.empty{padding:1.2rem;color:#a8b5c2}@media(max-width:650px){body{padding:1rem}header{display:block}}
  </style>
<link rel="stylesheet" href="/static/task_capture.css?v=20261010-screenshots"></head>
<body class="auxiliary-task-page">
  <header><div><h1>Local Character Overview</h1><p class="muted">Locked local Costume-Dressing FRONT images by character, phase, and costume.</p></div><nav><a href="/local-body-reference">Body-Reference</a> · <a href="/local-head-image">Head-Image</a> · <a href="/local-character-assembly">Character-Assembly</a> · <a href="/local-costume-dressing">Costume-Dressing</a> · <a href="/">Dashboard</a> · <button id="toolbar-create-task" type="button">Create task</button> · <a id="toolbar-open-board" target="_blank" rel="noopener" hidden>Open board</a></nav></header><p id="task-context-notice" role="status" aria-live="polite" hidden></p>
  <p id="page-status" class="muted" aria-live="polite">Loading…</p>
  <main id="overview"></main>
  <!-- TASK_CAPTURE_FORM -->
  <script src="/static/task_capture.js?v=20261010-screenshots"></script>
  <script src="/static/auxiliary_task_context.js?v=20261010"></script>
  <script>
  (()=>{
    const host=document.querySelector('#overview'),pageStatus=document.querySelector('#page-status');
    const escPath=value=>encodeURIComponent(value);
    const slotPath=(slot,action='autogenerate')=>`/api/local/character-overview/${escPath(slot.character)}/${escPath(slot.phase)}/${escPath(slot.name)}/${action}`;
    const task=window.ZetAuxiliaryTasks;
    let loading=false, overviewData=null, selectedSlot=null, initial=true, failed=false;
    task.install('local-character-overview','Local Character Overview',()=>{
      const slot=selectedSlot;
      const found=overviewData?.rows?.find(row=>row.character===slot?.character&&row.phase===slot?.phase)?.costumes?.find(item=>item.name===slot?.name);
      const pending=!overviewData&&!failed;
      const selections={};
      for(const [key,id] of Object.entries({character:slot?.character,phase:slot?.phase,costume:slot?.name})) selections[key]=task.selection(id,id,Boolean(found),pending,failed);
      if(found) {
        const pipeline=found.pipeline||'costume-dressing';
        selections.pipeline=task.selection(pipeline,pipeline);
        selections.run=task.selection(found.job_id,found.job_id);
      }
      return {selections,parameters:{character:slot?.character,phase:slot?.phase,costume:slot?.name}};
    });
    if(task.recorded&&task.route.get('costume')) selectedSlot={character:task.route.get('character'),phase:task.route.get('phase'),name:task.route.get('costume')};
    function markSlot(){host.querySelectorAll('[data-task-slot]').forEach(card=>card.classList.toggle('task-context-selected',card.dataset.taskSlot===JSON.stringify(selectedSlot)))}
    function make(tag,cls,text){const item=document.createElement(tag);if(cls)item.className=cls;if(text!==undefined)item.textContent=text;return item}
    function render(data){
      const rows=[];
      for(const row of data.rows||[]){
        const section=make('section','row'),title=make('h2','',`${row.character} · ${row.phase}`),slots=make('div','slots');section.append(title,slots);
        for(const slot of row.costumes||[]){slot.character=row.character;slot.phase=row.phase;const card=make('article','slot'),name=make('h3','',slot.name);card.append(name);card.dataset.taskSlot=JSON.stringify({character:row.character,phase:row.phase,name:slot.name});
          if(slot.image_url){const image=make('img');image.src=task.image(slot.image_url);image.alt=`Locked front view · ${row.character} · ${row.phase} · ${slot.name}`;image.loading='lazy';card.append(image)}
          else card.append(make('div','placeholder','No locked FRONT image'));
          const status=make('p','state'+(slot.state==='ERROR'?' error':''),slot.message||({IDLE:'Ready to generate.',QUEUED:'Queued.',RUNNING:`Working on ${slot.pipeline||'local pipeline'}…`,CANCELLED:'Stopped. Start again to retry.'}[slot.state]||slot.state));card.append(status);
          const actions=make('div','actions');if(slot.state==='RUNNING'||slot.state==='QUEUED'){const stop=make('button','', 'Stop');stop.dataset.action='stop';stop.dataset.path=slotPath(slot,'stop');actions.append(stop)}
          else if(!slot.image_url){const start=make('button','primary',slot.state==='ERROR'||slot.state==='CANCELLED'?'Try again':'Autogenerate');start.dataset.action='start';start.dataset.path=slotPath(slot);actions.append(start)}
          const report=make('button','','Create task');report.type='button';report.dataset.reportSlot=card.dataset.taskSlot;actions.append(report);
          card.append(actions);slots.append(card)
        }
        if(!(row.costumes||[]).length)section.append(make('p','empty','No costumes for this phase.'));
        rows.push(section)
      }
      if(!rows.length)host.replaceChildren(make('p','empty','No characters or phases were found.'));else host.replaceChildren(...rows);markSlot()
    }
    async function refresh(){if(loading)return;loading=true;try{const response=await task.fetch('/api/local/character-overview');const data=await response.json();if(!response.ok)throw new Error(data.detail||response.statusText);overviewData=data;failed=false;render(data);if(initial&&selectedSlot&&!data.rows?.some(row=>row.character===selectedSlot.character&&row.phase===selectedSlot.phase&&row.costumes?.some(slot=>slot.name===selectedSlot.name)))window.ZetTaskCapture.notice('The recorded character, phase, or costume is unavailable. The overview is open.');initial=false;pageStatus.textContent='Overview refreshes automatically while this page is open.'}catch(error){failed=true;pageStatus.textContent=error.message;pageStatus.className='error'}finally{loading=false}}
    host.addEventListener('click',async event=>{const report=event.target.closest('[data-report-slot]');if(report){selectedSlot=JSON.parse(report.dataset.reportSlot);markSlot();void window.ZetTaskCapture.open();return}const button=event.target.closest('button[data-action]');if(!button)return;button.disabled=true;try{const response=await task.fetch(button.dataset.path,{method:'POST'});const data=await response.json();if(!response.ok)throw new Error(data.detail||response.statusText);await refresh()}catch(error){pageStatus.textContent=error.message;pageStatus.className='error';button.disabled=false}});
    refresh();setInterval(refresh,2500);
  })();
  </script>
</body>
</html>
