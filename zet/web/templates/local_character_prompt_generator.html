<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prompt Generator Pilot · Zet</title>
  <link rel="stylesheet" href="/static/zet.css?v=20261025-pilot-rotation">
  <script defer src="/static/local_character_prompt_generator.js?v=20261025-pilot-rotation"></script>
</head>
<body class="pg-guided">
  <header class="pg-header">
    <div class="pg-heading"><a id="pg-return" href="/">← Return to batch</a><h1>Prompt Generator Pilot</h1><p id="pg-context"></p></div>
    <div class="pg-run-actions"><a id="pg-current" href="#">Current stage</a><details id="pg-menu"><summary>Run &amp; history</summary><div id="pg-run-menu"></div></details></div>
    <nav id="pg-steps" aria-label="Refinement cycle"></nav>
    <div class="pg-status"><strong id="pg-stage">Loading run…</strong><span id="pg-next"></span></div>
    <p id="pg-message" role="status" aria-live="polite">Loading saved progress…</p>
  </header>
  <main id="pg-workspace" aria-label="Pilot workspace"></main>
  <dialog id="pg-zoom"><button id="pg-close-zoom" type="button">Close image</button><img id="pg-zoom-image" alt="Full-size pilot image"></dialog>
</body>
</html>
