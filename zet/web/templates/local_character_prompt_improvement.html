<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Post-render Character.md improvement · Zet</title>
  <link rel="stylesheet" href="/static/zet.css?v=20261023-post-render">
  <script defer src="/static/local_character_prompt_improvement.js?v=20261023"></script>
</head>
<body>
  <main class="post-render-prompt">
    <a id="post-return" href="/">← Return to batch</a>
    <h1>Improve Character.md from renders</h1>
    <p>Review rendered views and observations, try selected Character.md edits, then keep or cancel.</p>
    <p id="post-message" role="status" aria-live="polite"></p>
    <section id="post-views" aria-label="Rendered view cards"></section>
    <section class="control-panel" aria-label="Template suggestions">
      <h2>Character.md suggestions</h2>
      <label>Further direction <textarea id="post-direction" rows="3" maxlength="20000"></textarea></label>
      <div class="button-row"><button id="post-propose" type="button">Suggest Character.md edits</button><button id="post-cancel" type="button">Cancel without template changes</button></div>
      <div id="post-analysis"></div>
      <div id="post-diff"></div>
      <button id="post-trial" type="button" hidden>Accept selected suggestions and render trials</button>
    </section>
    <section id="post-results" class="control-panel" aria-label="Trial render results" hidden>
      <h2>Trial renders</h2>
      <p>Two private renders are queued for each affected view. They will not enter the batch gallery.</p>
      <div id="post-trial-cards"></div>
      <div class="button-row"><button id="post-keep" type="button">Keep Character.md changes</button><button id="post-refine" type="button">Observe and refine again</button></div>
    </section>
  </main>
</body>
</html>
